name: PUSH START Offroad Android

on:
  workflow_dispatch:

jobs:
  fdroid-beta-arm64:
    name: F-Droid Beta ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 200
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Configure cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-fdroid-beta-arm64

      - name: Configure test APK signing
        shell: bash
        run: |
          cat > android/app/secure.properties <<'EOF'
          spropStoreFile = 'debug.keystore'
          spropStorePassword = '12345678'
          spropKeyAlias = 'debug'
          spropKeyPassword = '12345678'
          EOF

      - name: Build F-Droid Beta ARM64 APK
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew assembleFdroidBeta -Parm64

      - name: Verify installable ARM64 APK
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/**/*.apk)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK found"
            exit 1
          fi

          printf '%s\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PUSH-START-Offroad-FDroid-Beta-ARM64
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
