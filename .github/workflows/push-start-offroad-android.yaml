name: PUSH START Offroad Android

on:
  workflow_dispatch:
  push:
    branches:
      - push-start-offroad-v0.1

jobs:
  fdroid-beta-arm64:
    name: F-Droid Beta ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      - name: Install Android build dependencies
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.22.1'

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive 

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-fdroid-beta-arm64

        - name: Configure test APK signing
        shell: bash
        run: |
          cat > android/app/secure.properties <<'EOF'
          spropStoreFile = 'debug.keystore'
          spropStorePassword = '12345678'
          spropKeyAlias = 'debug'
          spropKeyPassword = '12345678'
          EOF

      - name: Build F-Droid Beta ARM64 APK
        shell: bash
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew assembleFdroidBeta -Parm64

      - name: Verify installable ARM64 APK
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/fdroid/beta/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          }
          apk=${apks[0]}
          apksigner verify --verbose "$apk"
          [[ $(apkanalyzer manifest application-id "$apk") == app.organicmaps.beta ]]
          mapfile -t abis < <(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u)
          [[ ${#abis[@]} -eq 1 && ${abis[0]} == arm64-v8a ]] || {
            printf 'Unexpected APK ABIs: %s\n' "${abis[*]}" >&2
            exit 1
          }
          sha256sum "$apk" | tee "$apk.sha256"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: push-start-offroad-fdroid-beta-arm64
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
